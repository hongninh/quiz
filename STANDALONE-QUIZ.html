<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Standalone - Hoạt động 100%</title>
    <style>
/**
 * GLOBAL QUIZ CSS
 * Styles dùng chung cho tất cả các quiz trên procfu.com
 * Nhúng file này vào <head> của trang global hoặc từng page
 */

/* ========== RESET & BASE ========== */
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* ========== QUIZ CONTAINER ========== */
#quiz-container { 
    width: 100%; 
    max-width: 900px; 
}

.quiz-container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
    animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========== QUIZ HEADER ========== */
.quiz-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e0e0e0;
}

.quiz-main-title { 
    font-size: 28px; 
    color: #333; 
    margin-bottom: 10px; 
}

.quiz-description { 
    font-size: 14px; 
    color: #666; 
    line-height: 1.6; 
}

/* ========== PROGRESS BAR ========== */
.quiz-progress { 
    margin-bottom: 30px; 
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    transition: width 0.3s ease;
    border-radius: 10px;
}

.progress-text { 
    text-align: center; 
    color: #666; 
    font-size: 14px; 
    font-weight: 600; 
}

/* ========== QUESTION ELEMENTS ========== */
.question-title { 
    font-size: 22px; 
    color: #333; 
    margin-bottom: 20px; 
    line-height: 1.5; 
}

.question-type-badge {
    display: inline-block;
    padding: 5px 15px;
    background: #667eea;
    color: white;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 15px;
}

.question-image {
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

/* ========== TEXT ANSWERS (MCQ/MULTI) ========== */
.text-answers-container { 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
}

.text-answer-option {
    display: flex;
    align-items: center;
    padding: 18px 20px;
    background: #f8f9fa;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 16px;
}

.text-answer-option:hover:not(.disabled) {
    background: #f0f0f0;
    border-color: #667eea;
    transform: translateX(5px);
}

.text-answer-option.selected { 
    background: #f0f4ff; 
    border-color: #667eea; 
}

.text-answer-option.correct { 
    background: #d4edda; 
    border-color: #28a745; 
}

.text-answer-option.incorrect { 
    background: #f8d7da; 
    border-color: #dc3545; 
}

.text-answer-option.disabled { 
    cursor: not-allowed; 
}

.answer-letter {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 35px;
    height: 35px;
    background: #667eea;
    color: white;
    border-radius: 50%;
    font-weight: bold;
    margin-right: 15px;
    flex-shrink: 0;
}

.text-answer-option.correct .answer-letter { 
    background: #28a745; 
}

.text-answer-option.incorrect .answer-letter { 
    background: #dc3545; 
}

.answer-text { 
    flex: 1; 
    color: #333; 
}

.answer-checkbox { 
    margin-left: 10px; 
    font-size: 20px; 
    color: #667eea; 
}

/* ========== IMAGE ANSWERS ========== */
.image-answers-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.image-answer-option {
    position: relative;
    cursor: pointer;
    border: 3px solid #e0e0e0;
    border-radius: 15px;
    overflow: hidden;
    transition: all 0.3s ease;
    background: white;
}

.image-answer-option:hover:not(.disabled) {
    border-color: #667eea;
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
}

.image-answer-option.selected { 
    border-color: #667eea; 
    background: #f0f4ff; 
}

.image-answer-option.correct { 
    border-color: #28a745; 
    background: #d4edda; 
}

.image-answer-option.incorrect { 
    border-color: #dc3545; 
    background: #f8d7da; 
}

.image-answer-option.disabled { 
    cursor: not-allowed; 
    opacity: 0.7; 
}

.image-answer-img { 
    width: 100%; 
    height: 150px; 
    object-fit: cover; 
    display: block; 
}

.image-answer-text { 
    padding: 15px; 
    text-align: center; 
    font-weight: 500; 
    color: #333; 
    font-size: 15px; 
}

.image-answer-checkbox {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: white;
    border: 2px solid #667eea;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #667eea;
    transition: all 0.3s ease;
}

.image-answer-option.selected .image-answer-checkbox { 
    background: #667eea; 
    color: white; 
}

.image-answer-option.correct .image-answer-checkbox { 
    background: #28a745; 
    border-color: #28a745; 
    color: white; 
}

.image-answer-option.incorrect .image-answer-checkbox { 
    background: #dc3545; 
    border-color: #dc3545; 
    color: white; 
}

/* ========== HOTSPOT ========== */
.hotspot-container { 
    margin-top: 20px; 
    position: relative; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
}

.hotspot-image-wrapper { 
    position: relative; 
    display: inline-block; 
    max-width: 100%; 
}

.hotspot-image { 
    width: 100%; 
    max-width: 800px; 
    height: auto; 
    display: block; 
    border-radius: 15px; 
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); 
}

.hotspot-overlay { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    cursor: crosshair; 
}

.hotspot-click-point {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.9);
    border: 3px solid #667eea;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #667eea;
    font-size: 20px;
}

.hotspot-click-point.correct { 
    background: #28a745; 
    border-color: #28a745; 
    color: white; 
}

.hotspot-click-point.incorrect { 
    background: #dc3545; 
    border-color: #dc3545; 
    color: white; 
}

.hotspot-instructions {
    background: #fff3cd;
    color: #856404;
    padding: 12px 20px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: 500;
    width: 100%;
}

.hotspot-point {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.9);
    border: 3px solid #667eea;
    border-radius: 50%;
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #667eea;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7); }
    50% { box-shadow: 0 0 0 15px rgba(102, 126, 234, 0); }
}

.hotspot-point:hover { 
    transform: translate(-50%, -50%) scale(1.2); 
}

.hotspot-point.selected { 
    background: #667eea; 
    color: white; 
    animation: none; 
}

.hotspot-point.correct { 
    background: #28a745; 
    border-color: #28a745; 
    color: white; 
    animation: none; 
}

.hotspot-point.incorrect { 
    background: #dc3545; 
    border-color: #dc3545; 
    color: white; 
    animation: none; 
}

.hotspot-point.disabled { 
    cursor: not-allowed; 
}

/* ========== ORDER (DRAG & DROP SEQUENCE) ========== */
.order-container { 
    margin-top: 20px; 
}

.order-items { 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
}

.order-item {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    background: #f8f9fa;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    cursor: move;
    transition: all 0.3s ease;
}

.order-item:hover:not(.disabled) {
    background: #f0f0f0;
    border-color: #667eea;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
}

.order-item.dragging { 
    opacity: 0.5; 
}

.order-item.disabled { 
    cursor: not-allowed; 
}

.order-number {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 35px;
    height: 35px;
    background: #667eea;
    color: white;
    border-radius: 50%;
    font-weight: bold;
    margin-right: 15px;
    flex-shrink: 0;
}

.order-text { 
    flex: 1; 
    color: #333; 
}

.drag-handle { 
    font-size: 20px; 
    color: #999; 
    cursor: move; 
}

/* ========== IMAGE PAIR ========== */
.image-pair-container { 
    margin-top: 20px; 
}

.pair-instructions {
    background: #d1ecf1;
    color: #0c5460;
    padding: 12px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 500;
}

.pair-columns { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 30px; 
}

.pair-column { 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
}

.pair-column-header {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
}

.pair-column.safe .pair-column-header { 
    background: #d4edda; 
    color: #155724; 
}

.pair-column.danger .pair-column-header { 
    background: #f8d7da; 
    color: #721c24; 
}

.pair-item {
    position: relative;
    border: 3px solid #e0e0e0;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s ease;
    background: white;
}

.pair-item:hover:not(.disabled) {
    border-color: #667eea;
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.pair-item.selected { 
    border-color: #667eea; 
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3); 
}

.pair-item.matched { 
    border-color: #28a745; 
    opacity: 0.6; 
}

.pair-item.disabled { 
    cursor: not-allowed; 
}

.pair-item-img { 
    width: 100%; 
    height: 150px; 
    object-fit: cover; 
}

.pair-item-label {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(255, 255, 255, 0.9);
    border: 2px solid #667eea;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #667eea;
}

.pair-item.selected .pair-item-label { 
    background: #667eea; 
    color: white; 
}

.pair-item.matched .pair-item-label { 
    background: #28a745; 
    border-color: #28a745; 
    color: white; 
}

/* ========== DRAG & DROP ========== */
.drag-drop-container { 
    margin-top: 20px; 
}

.drag-source {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.drag-source-title { 
    font-size: 16px; 
    font-weight: 600; 
    color: #333; 
    margin-bottom: 15px; 
}

.draggable-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 15px;
}

.draggable-item {
    cursor: move;
    border: 2px solid #667eea;
    border-radius: 10px;
    overflow: hidden;
    background: white;
    transition: all 0.3s ease;
}

.draggable-item:hover { 
    transform: scale(1.05); 
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2); 
}

.draggable-item.dragging { 
    opacity: 0.5; 
}

.draggable-item.placed { 
    opacity: 0.3; 
    cursor: not-allowed; 
}

.draggable-item-img { 
    width: 100%; 
    height: 80px; 
    object-fit: cover; 
}

.draggable-item-label {
    padding: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    background: #667eea;
    color: white;
}

.drop-zones { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 20px; 
    margin-top: 20px; 
}

.drop-zone {
    min-height: 300px;
    padding: 20px;
    border: 3px dashed #ccc;
    border-radius: 15px;
    background: #fafafa;
    transition: all 0.3s ease;
}

.drop-zone.drag-over { 
    border-color: #667eea; 
    background: #f0f4ff; 
}

.drop-zone-header {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 15px;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
}

.drop-zone.safe .drop-zone-header { 
    background: #d4edda; 
    color: #155724; 
}

.drop-zone.danger .drop-zone-header { 
    background: #f8d7da; 
    color: #721c24; 
}

.drop-zone-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
}

.dropped-item { 
    position: relative; 
}

.remove-item {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

/* ========== BUTTONS ========== */
.submit-button, .next-button, .retry-button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.submit-button:hover:not(:disabled), 
.next-button:hover, 
.retry-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.submit-button:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
    transform: none; 
}

/* ========== FEEDBACK ========== */
.feedback-message {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    font-weight: 600;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { 
    from { opacity: 0; } 
    to { opacity: 1; } 
}

.feedback-correct { 
    background: #d4edda; 
    color: #155724; 
}

.feedback-incorrect { 
    background: #f8d7da; 
    color: #721c24; 
}

.feedback-icon { 
    font-size: 24px; 
}

.explanation {
    background: #e7f3ff;
    border-left: 4px solid #2196F3;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
    color: #0c5460;
    line-height: 1.6;
}

/* ========== RESULTS ========== */
.results-container { 
    text-align: center; 
}

.results-header h2 { 
    font-size: 32px; 
    color: #333; 
    margin-bottom: 30px; 
}

.results-score { 
    display: flex; 
    justify-content: center; 
    margin-bottom: 30px; 
}

.score-circle { 
    position: relative; 
    width: 200px; 
    height: 200px; 
}

.score-circle svg { 
    transform: rotate(-90deg); 
}

.score-circle-bg { 
    fill: none; 
    stroke: #e0e0e0; 
    stroke-width: 8; 
}

.score-circle-fill { 
    fill: none; 
    stroke-width: 8; 
    transition: stroke-dasharray 1s ease; 
}

.score-circle.passed .score-circle-fill { 
    stroke: #28a745; 
}

.score-circle.failed .score-circle-fill { 
    stroke: #dc3545; 
}

.score-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.score-percentage { 
    font-size: 48px; 
    font-weight: bold; 
    color: #333; 
}

.score-fraction { 
    font-size: 18px; 
    color: #666; 
    margin-top: 5px; 
}

.results-message { 
    font-size: 20px; 
    font-weight: 600; 
    padding: 20px; 
    border-radius: 10px; 
    margin-bottom: 30px; 
}

.message-passed { 
    background: #d4edda; 
    color: #155724; 
}

.message-failed { 
    background: #f8d7da; 
    color: #721c24; 
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
    .quiz-container { 
        padding: 20px; 
    }
    
    .question-title { 
        font-size: 18px; 
    }
    
    .image-answers-container { 
        grid-template-columns: 1fr; 
    }
    
    .drop-zones, .pair-columns { 
        grid-template-columns: 1fr; 
    }
    
    .draggable-items { 
        grid-template-columns: repeat(3, 1fr); 
    }
    
    .score-circle { 
        width: 150px; 
        height: 150px; 
    }
    
    .score-percentage { 
        font-size: 36px; 
    }
}
    </style>
</head>
<body>
    <div id="quiz-container"></div>

    <script>
/**
 * GLOBAL QUIZ ENGINE WITH ID SYSTEM
 * Core JavaScript engine cho tất cả các quiz trên procfu.com
 * Phiên bản này sử dụng ID thay vì index
 * Nhúng file này trước local-quiz-*.js
 */

class QuizEngine {
    constructor(gameData) {
        this.gameData = gameData;
        this.questions = gameData.EachQuiz || [];
        this.currentQuestionIndex = 0;
        this.score = 0;
        this.totalPoints = 0;
        this.maxPoints = gameData.main_total_max_points || 0;
        this.answers = [];
        this.quizResults = [];
        this.container = null;
        this.currentAnswer = null;
        this.currentQuestionStartTime = null;
        this.quizStartTime = null;
        this.streak = 0;
        this.cumulativeScore = 0;
    }

    init(containerId) {
        this.container = document.getElementById(containerId);
        if (!this.container) {
            console.error('Container not found:', containerId);
            return;
        }
        this.quizStartTime = new Date();
        this.render();
    }

    render() {
        if (this.currentQuestionIndex < this.questions.length) {
            this.renderQuestion();
        } else {
            this.renderResults();
        }
    }

    renderQuestion() {
        const q = this.questions[this.currentQuestionIndex];
        const total = this.questions.length;
        const num = this.currentQuestionIndex + 1;
        this.currentQuestionStartTime = new Date();

        let qHtml = '';
        switch (q.qtype) {
            case 'mcq': qHtml = this.renderMCQ(q); break;
            case 'multi': qHtml = this.renderMulti(q); break;
            case 'image_mcq': qHtml = this.renderImageMCQ(q); break;
            case 'image_multi': qHtml = this.renderImageMulti(q); break;
            case 'hotspot': qHtml = this.renderHotspot(q); break;
            case 'multi_hotspot': qHtml = this.renderMultiHotspot(q); break;
            case 'order': qHtml = this.renderOrder(q); break;
            case 'image_pair': qHtml = this.renderImagePair(q); break;
            case 'drag_drop': qHtml = this.renderDragDrop(q); break;
        }

        this.container.innerHTML = `
            <div class="quiz-container">
                ${num === 1 ? `<div class="quiz-header">
                    <h1 class="quiz-main-title">${this.gameData.main_title}</h1>
                    <p class="quiz-description">${this.gameData.main_description}</p>
                </div>` : ''}
                <div class="quiz-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${(num / total) * 100}%"></div>
                    </div>
                    <div class="progress-text">Câu ${num} / ${total} • ${q.pmax} điểm</div>
                </div>
                <div class="question-container">
                    <span class="question-type-badge">${this.getTypeLabel(q.qtype)}</span>
                    <h2 class="question-title">${q.qtxt}</h2>
                    ${qHtml}
                </div>
            </div>
        `;
        this.attachEventListeners(q);
    }

    getTypeLabel(t) {
        const l = {
            'mcq': 'Chọn 1 đáp án',
            'multi': 'Chọn nhiều đáp án',
            'image_mcq': 'Chọn 1 hình',
            'image_multi': 'Chọn nhiều hình',
            'hotspot': 'Click điểm',
            'multi_hotspot': 'Click nhiều điểm',
            'order': 'Sắp xếp',
            'image_pair': 'Ghép cặp',
            'drag_drop': 'Kéo thả'
        };
        return l[t] || t;
    }

    // ===== TEXT MCQ (với text_id) =====
    renderMCQ(q) {
        return `

    attachEventListeners(q) {
        switch (q.qtype) {
            case 'mcq': this.onMCQ(q); break;
            case 'multi': this.onMulti(q); break;
            case 'image_mcq': this.onImageMCQ(q); break;
            case 'image_multi': this.onImageMulti(q); break;
            case 'hotspot': this.onHotspot(q); break;
            case 'multi_hotspot': this.onMultiHotspot(q); break;
            case 'order': this.onOrder(q); break;
            case 'image_pair': this.onImagePair(q); break;
            case 'drag_drop': this.onDragDrop(q); break;
        }
    }

    // ===== EVENT: MCQ (so sánh text_id) =====
    onMCQ(q) {
        const opts = this.container.querySelectorAll('.text-answer-option');
        opts.forEach(opt => {
            opt.onclick = () => {
                if (opt.classList.contains('disabled')) return;
                const selectedId = opt.dataset.id;
                const ok = selectedId === q.sol_array;
                
                opts.forEach(o => o.classList.add('disabled'));
                opt.classList.add(ok ? 'correct' : 'incorrect');
                
                if (!ok) {
                    const correctOpt = this.container.querySelector(`.text-answer-option[data-id="${q.sol_array}"]`);
                    if (correctOpt) correctOpt.classList.add('correct');
                }
                
                this.recordAnswer(q, selectedId, ok);
                this.feedback(ok, q.pmax, q);
            };
        });
    }

    // ===== EVENT: MULTI (so sánh text_id) =====
    onMulti(q) {
        const opts = this.container.querySelectorAll('.text-answer-option');
        const btn = this.container.querySelector('#submit-multi');
        const sel = new Set();
        
        opts.forEach(opt => {
            opt.onclick = () => {
                if (opt.classList.contains('disabled')) return;
                const id = opt.dataset.id;
                
                if (sel.has(id)) {
                    sel.delete(id);
                    opt.classList.remove('selected');
                    opt.querySelector('.answer-checkbox').textContent = '☐';
                } else {
                    sel.add(id);
                    opt.classList.add('selected');
                    opt.querySelector('.answer-checkbox').textContent = '☑️';
                }
                btn.disabled = sel.size === 0;
            };
        });
        
        btn.onclick = () => {
            const correctIds = new Set(q.sol_array);
            const ok = sel.size === correctIds.size && [...sel].every(id => correctIds.has(id));
            
            opts.forEach(opt => {
                opt.classList.add('disabled');
                const id = opt.dataset.id;
                if (correctIds.has(id)) {
                    opt.classList.add('correct');
                } else if (sel.has(id)) {
                    opt.classList.add('incorrect');
                }
            });
            
            btn.disabled = true;
            this.recordAnswer(q, [...sel], ok);
            this.feedback(ok, q.pmax, q);
        };
    }

    // ===== EVENT: HOTSPOT (so sánh x_y_id) =====
    onHotspot(q) {
        const overlay = this.container.querySelector('#hotspot-overlay');
        const img = this.container.querySelector('#hotspot-img');
        let clicked = false;
        
        overlay.onclick = (e) => {
            if (clicked) return;
            
            const rect = img.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (img.naturalWidth / rect.width);
            const y = (e.clientY - rect.top) * (img.naturalHeight / rect.height);
            const dist = Math.hypot(x - q.sol_json.x, y - q.sol_json.y);
            const ok = dist <= q.sol_json.radius;

            const pt = document.createElement('div');
            pt.className = `hotspot-click-point ${ok ? 'correct' : 'incorrect'}`;
            pt.style.left = `${((e.clientX - rect.left) / rect.width) * 100}%`;
            pt.style.top = `${((e.clientY - rect.top) / rect.height) * 100}%`;
            pt.textContent = ok ? '✓' : '✗';
            overlay.appendChild(pt);

            if (!ok) {
                const cor = document.createElement('div');
                cor.className = 'hotspot-click-point correct';
                cor.style.left = `${(q.sol_json.x / img.naturalWidth) * 100}%`;
                cor.style.top = `${(q.sol_json.y / img.naturalHeight) * 100}%`;
                cor.textContent = '✓';
                overlay.appendChild(cor);
            }
            
            clicked = true;
            this.recordAnswer(q, { x: Math.round(x), y: Math.round(y), clicked_id: q.sol_json.x_y_id }, ok);
            this.feedback(ok, q.pmax, q);
        };
    }

    // ===== EVENT: ORDER (so sánh text_id) =====
    onOrder(q) {
        const items = this.container.querySelectorAll('.order-item');
        const btn = this.container.querySelector('#submit-order');
        let drag = null;
        
        items.forEach(item => {
            item.ondragstart = () => { 
                drag = item;
                item.classList.add('dragging');
            };
            item.ondragend = () => item.classList.remove('dragging');
            item.ondragover = (e) => {
                e.preventDefault();
                const cont = this.container.querySelector('#order-items');
                const after = this.getDragAfter(cont, e.clientY);
                if (!after) cont.appendChild(drag);
                else cont.insertBefore(drag, after);
                this.updateOrderNums();
            };
        });
        
        btn.onclick = () => {
            const currentOrder = Array.from(this.container.querySelectorAll('.order-item'))
                .map(i => i.dataset.id);
            const ok = JSON.stringify(currentOrder) === JSON.stringify(q.sol_array);
            
            this.container.querySelectorAll('.order-item').forEach(i => {
                i.classList.add('disabled');
                i.draggable = false;
            });
            
            btn.disabled = true;
            this.recordAnswer(q, currentOrder, ok);
            this.feedback(ok, q.pmax, q);
        };
    }

    updateOrderNums() {
        this.container.querySelectorAll('.order-item').forEach((i, idx) => {
            i.querySelector('.order-number').textContent = idx + 1;
        });
    }

    getDragAfter(cont, y) {
        const els = [...cont.querySelectorAll('.order-item:not(.dragging)')];
        return els.reduce((close, child) => {
            const box = child.getBoundingClientRect();
            const off = y - box.top - box.height / 2;
            if (off < 0 && off > close.offset) return { offset: off, element: child };
            return close;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // ===== EVENT: IMAGE PAIR (so sánh image_id) =====
    onImagePair(q) {
        const items = this.container.querySelectorAll('.pair-item');
        const btn = this.container.querySelector('#submit-pair');
        let first = null;
        const pairs = [];
        
        items.forEach(item => {
            item.onclick = () => {
                if (item.classList.contains('matched') || item.classList.contains('disabled')) return;
                
                if (!first) {
                    first = item;
                    item.classList.add('selected');
                } else {
                    if (first === item) {
                        first.classList.remove('selected');
                        first = null;
                        return;
                    }
                    
                    if (first.dataset.group !== item.dataset.group) {
                        const id1 = first.dataset.group === 'col1' ? first.dataset.id : item.dataset.id;
                        const id2 = first.dataset.group === 'col2' ? first.dataset.id : item.dataset.id;
                        pairs.push([id1, id2]);
                        
                        first.classList.add('matched');
                        first.classList.remove('selected');
                        item.classList.add('matched');
                        first = null;
                        
                        const expectedPairs = q.sol_array.length;
                        btn.disabled = pairs.length !== expectedPairs;
                    } else {
                        first.classList.remove('selected');
                        first = item;
                        item.classList.add('selected');
                    }
                }
            };
        });
        
        btn.onclick = () => {
            let correctCount = 0;
            const solutionMap = new Map(q.sol_array.map(p => [JSON.stringify(p.sort()), true]));
            
            pairs.forEach(p => {
                if (solutionMap.has(JSON.stringify([...p].sort()))) {
                    correctCount++;
                }
            });
            
            const ok = correctCount === q.sol_array.length;
            items.forEach(i => i.classList.add('disabled'));
            btn.disabled = true;
            
            this.recordAnswer(q, pairs, ok);
            this.feedback(ok, q.pmax, q, `Ghép đúng ${correctCount}/${q.sol_array.length}`);
        };
    }

    // ===== EVENT: DRAG DROP (so sánh image_id) =====
    onDragDrop(q) {
        const drags = this.container.querySelectorAll('.draggable-item');
        const zones = this.container.querySelectorAll('.drop-zone');
        const btn = this.container.querySelector('#submit-drag-drop');
        const placement = {};

        drags.forEach(d => {
            d.ondragstart = (e) => {
                if (d.classList.contains('placed')) return;
                d.classList.add('dragging');
                e.dataTransfer.setData('id', d.dataset.id);
            };
            d.ondragend = () => d.classList.remove('dragging');
        });

        zones.forEach(z => {
            z.ondragover = (e) => { 
                e.preventDefault();
                z.classList.add('drag-over');
            };
            z.ondragleave = () => z.classList.remove('drag-over');
            z.ondrop = (e) => {
                e.preventDefault();
                z.classList.remove('drag-over');
                const id = e.dataTransfer.getData('id');
                const d = this.container.querySelector(`.draggable-item[data-id="${id}"]`);
                if (!d || d.classList.contains('placed')) return;

                const zType = z.dataset.zone;
                const zItems = z.querySelector('.drop-zone-items');
                const clone = d.cloneNode(true);
                clone.classList.add('dropped-item');
                clone.removeAttribute('draggable');

                const rmBtn = document.createElement('button');
                rmBtn.className = 'remove-item';
                rmBtn.innerHTML = '×';
                rmBtn.onclick = () => {
                    clone.remove();
                    d.classList.remove('placed');
                    delete placement[id];
                    btn.disabled = Object.keys(placement).length !== q.drag_items.length;
                };
                
                clone.appendChild(rmBtn);
                zItems.appendChild(clone);
                d.classList.add('placed');
                placement[id] = zType;
                btn.disabled = Object.keys(placement).length !== q.drag_items.length;
            };
        });

        btn.onclick = () => {
            let correctCount = 0;
            
            q.drag_items.forEach(item => {
                if (placement[item.image_id] === item.correct_zone) {
                    correctCount++;
                }
            });
            
            const ok = correctCount === q.drag_items.length;
            btn.disabled = true;
            drags.forEach(d => d.draggable = false);
            
            this.recordAnswer(q, placement, ok);
            this.feedback(ok, q.pmax, q, `Xếp đúng ${correctCount}/${q.drag_items.length}`);
        };
    }

    // ===== RECORD ANSWER WITH IDS =====
    recordAnswer(q, userAnswer, isCorrect) {
        this.answers.push({
            question_id: q.qid,
            question_number: q.qn,
            question_type: q.qtype,
            user_answer: userAnswer,
            user_answer_ids: this.extractIds(userAnswer, q.qtype),
            correct_answer: q.sol_array || q.sol_json,
            correct_answer_ids: this.extractCorrectIds(q),
            is_correct: isCorrect,
            points_earned: isCorrect ? q.pmax : 0,
            max_points: q.pmax
        });
    }

    // ===== EXTRACT USER ANSWER IDS =====
    extractIds(answer, qtype) {
        if (!answer) return null;
        
        // Already IDs (string or array of strings)
        if (typeof answer === 'string') return answer;
        if (Array.isArray(answer) && answer.every(a => typeof a === 'string')) {
            return answer;
        }
        
        // Array of pairs (image_pair)
        if (Array.isArray(answer) && answer.length > 0 && Array.isArray(answer[0])) {
            return answer; // Already [[id1, id2], ...]
        }
        
        // Object (hotspot, drag_drop)
        if (typeof answer === 'object') {
            if (answer.clicked_id) return answer.clicked_id;
            if (answer.x_y_id) return answer.x_y_id;
            // Drag drop placement: { img_009_1: "safe", img_009_2: "danger" }
            return answer;
        }
        
        return answer;
    }

    // ===== EXTRACT CORRECT ANSWER IDS =====
    extractCorrectIds(q) {
        const sol = q.sol_array || q.sol_json;
        
        if (!sol) return null;
        
        // String ID
        if (typeof sol === 'string') return sol;
        
        // Array of IDs
        if (Array.isArray(sol)) return sol;
        
        // Hotspot object
        if (sol.x_y_id) return sol.x_y_id;
        
        return sol;
    }

    // ===== FEEDBACK WITH DETAILED TRACKING =====
    feedback(ok, pts, q, msg = '') {
        const endTime = new Date();
        const playTime = endTime - this.currentQuestionStartTime;
        const timeRemaining = (q.tmax || 0) - playTime;

        if (ok) {
            this.score += pts;
            this.streak++;
            const bonusPts = this.streak >= 3 ? Math.floor(pts * 0.1) : 0;
            this.cumulativeScore = this.score + bonusPts;
        } else {
            this.streak = 0;
        }

        this.totalPoints += pts;
        
        const fb = document.createElement('div');
        fb.className = `feedback-message ${ok ? 'correct' : 'incorrect'}`;
        fb.innerHTML = `
            <div class="feedback-icon">${ok ? '✓' : '✗'}</div>
            <div class="feedback-content">
                <div class="feedback-title">${ok ? 'Chính xác!' : 'Chưa đúng!'}</div>
                ${msg ? `<div class="feedback-detail">${msg}</div>` : ''}
                <div class="feedback-explanation">${q.expl || ''}</div>
                <div class="feedback-points">+${ok ? pts : 0} điểm</div>
            </div>
        `;
        this.container.querySelector('.question-container').appendChild(fb);

        // Get last answer for this question
        const lastAnswer = this.answers[this.answers.length - 1];

        this.quizResults.push({
            qn: q.qn,
            lq: q.lq || false,
            qid: q.qid,
            qtype: q.qtype,
            ts_start: this.currentQuestionStartTime.toISOString(),
            ts_end: endTime.toISOString(),
            pt: playTime,
            ps: pts,
            ans: lastAnswer ? lastAnswer.user_answer_ids : null,
            ans_raw: lastAnswer ? lastAnswer.user_answer : null,
            cor: ok,
            skip: false,
            trem: Math.max(0, timeRemaining),
            hint: false,
            pen: 0,
            cum: this.cumulativeScore,
            streak: this.streak,
            sol: lastAnswer ? lastAnswer.correct_answer_ids : (q.sol_array || q.sol_json),
            sol_raw: q.sol_array || q.sol_json,
            show_sol: q.display_correct_answer === 'y'
            // Note: expl field removed from output (only used for display)
        });

        setTimeout(() => {
            this.currentQuestionIndex++;
            this.render();
        }, 2500);
    }

    // ===== RENDER RESULTS =====
    renderResults() {
        const totalTime = new Date() - this.quizStartTime;
        const percent = Math.round((this.score / this.totalPoints) * 100);
        const passThreshold = this.gameData.main_pass_threshold_percent || 70;
        const passed = percent >= passThreshold;
        
        // Generate detailed output with IDs
        this.generateDetailedOutput();

        const resultHtml = `
            <div class="quiz-container results-container">
                <div class="results-header">
                    <h1 class="results-title">${passed ? '🎉 Xuất sắc!' : '💪 Cố gắng thêm!'}</h1>
                    <div class="results-score-circle">
                        <div class="score-circle ${passed ? 'pass' : 'fail'}">
                            <span class="score-percent">${percent}%</span>
                            <span class="score-label">${this.score}/${this.totalPoints} điểm</span>
                        </div>
                    </div>
                </div>

                <div class="results-summary">
                    <div class="summary-item">
                        <span class="summary-label">Tổng câu hỏi:</span>
                        <span class="summary-value">${this.questions.length}</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Trả lời đúng:</span>
                        <span class="summary-value correct">${this.quizResults.filter(r => r.correct).length}</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Trả lời sai:</span>
                        <span class="summary-value incorrect">${this.quizResults.filter(r => !r.correct).length}</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Thời gian:</span>
                        <span class="summary-value">${Math.floor(totalTime / 60000)}:${String(Math.floor((totalTime % 60000) / 1000)).padStart(2, '0')}</span>
                    </div>
                </div>

                <div class="results-details">
                    <h3 class="details-title">Chi tiết từng câu:</h3>
                    ${this.quizResults.map((r, i) => {
                        const ans = this.answers[i];
                        return `
                            <div class="result-item ${r.correct ? 'correct' : 'incorrect'}">
                                <div class="result-item-header">
                                    <span class="result-item-number">Câu ${r.qn}</span>
                                    <span class="result-item-type">${this.getTypeLabel(r.qtype)}</span>
                                    <span class="result-item-status">${r.correct ? '✓' : '✗'}</span>
                                </div>
                                <div class="result-item-body">
                                    <div class="result-item-points">${r.points}/${r.max_points} điểm</div>
                                    ${ans ? `
                                        <div class="result-item-answer">
                                            <strong>Bạn chọn:</strong> ${this.formatAnswer(ans.user_answer, r.qtype)}
                                        </div>
                                        ${!r.correct ? `
                                            <div class="result-item-correct">
                                                <strong>Đáp án đúng:</strong> ${this.formatAnswer(ans.correct_answer, r.qtype)}
                                            </div>
                                        ` : ''}
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="results-actions">
                    <button class="action-button primary" onclick="location.reload()">Chơi lại</button>
                    <button class="action-button secondary" onclick="QuizUtils.downloadResults()">Tải kết quả</button>
                    <button class="action-button secondary" onclick="QuizUtils.downloadJSON()">Tải JSON</button>
                    <button class="action-button secondary" onclick="QuizUtils.copyJSON()">Copy JSON</button>
                </div>
            </div>
        `;

        this.container.innerHTML = resultHtml;

        // Store results for utility functions
        window.currentQuizResults = {
            gameData: this.gameData,
            results: this.quizResults,
            answers: this.answers,
            score: this.score,
            totalPoints: this.totalPoints,
            percent: percent,
            totalTime: totalTime
        };
    }

    // ===== GENERATE DETAILED OUTPUT WITH IDS =====
    generateDetailedOutput() {
        const totalTime = new Date() - this.quizStartTime;
        const correctCount = this.quizResults.filter(r => r.cor).length;
        const wrongCount = this.quizResults.filter(r => !r.cor && !r.skip).length;
        const skippedCount = this.quizResults.filter(r => r.skip).length;
        const percent = Math.round((this.score / this.totalPoints) * 100);
        const passThreshold = this.gameData.main_pass_threshold_percent || 70;

        const detailedOutput = {
            main_game_id: this.gameData.main_game_id,
            main_title: this.gameData.main_title,
            main_game_version: this.gameData.main_game_version,
            main_author: this.gameData.main_author,
            main_language: this.gameData.main_language,
            main_total_questions: this.gameData.main_total_questions,
            main_total_max_points: this.gameData.main_total_max_points,
            player_info: {
                uid: `user_${Math.random().toString(36).substr(2, 9)}`,
                sid: `session_${Date.now()}`,
                att: 1,
                ua: navigator.userAgent,
                ip: 'hidden'
            },
            quiz_results: this.quizResults,
            summary: {
                total_score: this.score,
                max_score: this.totalPoints,
                correct_count: correctCount,
                wrong_count: wrongCount,
                skipped_count: skippedCount,
                avg_time_per_question_ms: Math.round(totalTime / this.questions.length),
                total_time_ms: totalTime,
                completion_rate_percent: 100,
                pass_status: percent >= passThreshold ? 'passed' : 'failed',
                percentage: percent
            }
        };

        // Store for download/export
        window.detailedQuizOutput = detailedOutput;
        
        // Log to console
        console.log('📊 Detailed Quiz Results with IDs:', detailedOutput);
        console.log('📋 Copy this output:', JSON.stringify(detailedOutput, null, 2));
    }

    // ===== FORMAT ANSWER FOR DISPLAY =====
    formatAnswer(answer, qtype) {
        if (Array.isArray(answer)) {
            if (answer.length === 0) return '<em>Không có</em>';
            if (qtype === 'image_pair') {
                return answer.map(pair => `[${pair[0]} ↔ ${pair[1]}]`).join(', ');
            }
            return answer.join(', ');
        }
        if (typeof answer === 'object') {
            if (answer.x !== undefined && answer.y !== undefined) {
                return `x: ${answer.x}, y: ${answer.y}`;
            }
            return JSON.stringify(answer);
        }
        return String(answer);
    }
}

window.QuizUtils = {
    downloadResults() {
        const r = window.currentQuizResults;
        if (!r) return;
        
        const text = `
${r.gameData.main_title}
${'='.repeat(50)}

Điểm số: ${r.score}/${r.totalPoints} (${r.percent}%)
Thời gian: ${Math.floor(r.totalTime / 60000)}:${String(Math.floor((r.totalTime % 60000) / 1000)).padStart(2, '0')}

Chi tiết:
${r.results.map((res, i) => {
    const ans = r.answers[i];
    return `
Câu ${res.qn} (${res.qid}): ${res.correct ? '✓ Đúng' : '✗ Sai'} - ${res.points}/${res.max_points} điểm
  Bạn chọn: ${this._formatAnswerText(ans.user_answer, res.qtype)}
  ${!res.correct ? `Đáp án đúng: ${this._formatAnswerText(ans.correct_answer, res.qtype)}` : ''}
`;
}).join('\n')}
        `.trim();

        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `quiz-results-${Date.now()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    },

    copyResults() {
        const r = window.currentQuizResults;
        if (!r) return;
        
        const text = `${r.gameData.main_title}\nĐiểm: ${r.score}/${r.totalPoints} (${r.percent}%)`;
        navigator.clipboard.writeText(text).then(() => {
            alert('Đã copy kết quả!');
        });
    },

    _formatAnswerText(answer, qtype) {
        if (Array.isArray(answer)) {
            if (answer.length === 0) return 'Không có';
            if (qtype === 'image_pair') {
                return answer.map(pair => `[${pair[0]} ↔ ${pair[1]}]`).join(', ');
            }
            return answer.join(', ');
        }
        if (typeof answer === 'object') {
            if (answer.x !== undefined && answer.y !== undefined) {
                return `x: ${answer.x}, y: ${answer.y}`;
            }
            return JSON.stringify(answer);
        }
        return String(answer);
    }
};

/**
 * LOCAL QUIZ JAVASCRIPT
 * File khởi tạo cho từng quiz cụ thể
 * Nhúng sau global-quiz.js và local_datainput.js
 */

// Lấy dữ liệu Quiz từ file local_datainput.js
// Biến window.quizData đã được define trong local_datainput.js
function getQuizData() {
    // Kiểm tra xem data đã được load chưa
    if (typeof window.quizData !== 'undefined' && window.quizData !== null) {
        console.log('✅ Quiz data found:', window.quizData.main_title);
        return window.quizData;
    }
    
    // Fallback: nếu chưa có, log error với thông tin debug
    console.error('❌ Quiz data chưa được load!');
    console.error('   Kiểm tra:');
    console.error('   1. File local_datainput.js đã được nhúng chưa?');
    console.error('   2. Nhúng đúng thứ tự: global-quiz.js → local_datainput.js → local-quiz-complete.js');
    console.error('   3. Đường dẫn file có đúng không?');
    console.error('   Debug: window.quizData =', window.quizData);
    return null;
}

// Khởi chạy quiz khi DOM đã sẵn sàng
function initQuiz() {
    // Kiểm tra nếu QuizEngine đã được load
    if (typeof QuizEngine === 'undefined') {
        console.error('❌ QuizEngine chưa được load. Hãy chắc chắn rằng global-quiz.js đã được nhúng trước file này.');
        return;
    }

    // Lấy dữ liệu quiz từ local_datainput.js
    const quizData = getQuizData();
    
    if (!quizData) {
        console.error('❌ Không thể load quiz data. Kiểm tra lại local_datainput.js');
        return;
    }

    // Khởi tạo quiz engine với dữ liệu
    console.log('🚀 Khởi chạy quiz:', quizData.main_title);
    const quiz = new QuizEngine(quizData);
    
    // Khởi chạy quiz trong container có id="quiz-container"
    quiz.init('quiz-container');
}

// Tự động khởi chạy khi DOM sẵn sàng
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initQuiz);
} else {
    // Delay một chút để đảm bảo tất cả scripts đã load
    setTimeout(initQuiz, 100);
}
