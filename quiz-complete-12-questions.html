<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Hoàn Chỉnh - 12 Câu Hỏi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
#quiz-container { width: 100%; max-width: 900px; }
.quiz-container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    animation: slideIn 0.5s ease-out;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.quiz-progress { margin-bottom: 30px; }
.progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); transition: width 0.3s ease; border-radius: 10px; }
.progress-text { text-align: center; color: #666; font-size: 14px; font-weight: 600; }
.question-title { font-size: 24px; color: #333; margin-bottom: 20px; line-height: 1.5; }
.question-type-badge { display: inline-block; padding: 5px 15px; background: #667eea; color: white; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 15px; }
h1 { text-align: center; color: #333; margin-bottom: 30px; }
</style>
</head>
<body>
<div id="quiz-container">
<div class="quiz-container">
<h1>🎯 Quiz Hoàn Chỉnh - 12 Câu Hỏi</h1>
<p style="text-align:center; color:#666; margin-bottom:30px;">
File này đang được tạo... Vui lòng đợi phiên bản hoàn chỉnh!
</p>
</div>
</div>
</body>
</html>
