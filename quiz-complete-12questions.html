<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - An Toàn Giao Thông</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #quiz-container {
            width: 100%;
            max-width: 900px;
        }

        .quiz-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .quiz-main-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .quiz-description {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .quiz-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }

        /* Progress Bar */
        .quiz-progress {
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        /* Question Container */
        .question-container {
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .question-type-badge {
            display: inline-block;
            padding: 5px 15px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .question-image {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* MCQ & Multi Choice */
        .text-answers-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .text-answer-option {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .text-answer-option:hover:not(.disabled) {
            background: #f0f0f0;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .text-answer-option.selected {
            background: #f0f4ff;
            border-color: #667eea;
        }

        .text-answer-option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .text-answer-option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .text-answer-option.disabled {
            cursor: not-allowed;
        }

        .answer-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .text-answer-option.correct .answer-letter {
            background: #28a745;
        }

        .text-answer-option.incorrect .answer-letter {
            background: #dc3545;
        }

        .answer-text {
            flex: 1;
            color: #333;
        }

        .answer-checkbox {
            margin-left: 10px;
            font-size: 20px;
            color: #667eea;
        }

        /* Hotspot */
        .hotspot-container {
            margin-top: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hotspot-image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .hotspot-image {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .hotspot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .hotspot-click-point {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #667eea;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
            font-size: 20px;
        }

        .hotspot-click-point.correct {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        .hotspot-click-point.incorrect {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .hotspot-instructions {
            background: #fff3cd;
            color: #856404;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
        }

        /* Order/Sorting */
        .order-container {
            margin-top: 20px;
        }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: move;
            transition: all 0.3s ease;
        }

        .order-item:hover:not(.disabled) {
            background: #f0f0f0;
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .order-item.dragging {
            opacity: 0.5;
        }

        .order-item.disabled {
            cursor: not-allowed;
        }

        .order-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .order-text {
            flex: 1;
            color: #333;
        }

        .drag-handle {
            font-size: 20px;
            color: #999;
            cursor: move;
        }

        /* Image Pair */
        .image-pair-container {
            margin-top: 20px;
        }

        .pair-instructions {
            background: #d1ecf1;
            color: #0c5460;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .pair-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .pair-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pair-column-header {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
        }

        .pair-column.safe .pair-column-header {
            background: #d4edda;
            color: #155724;
        }

        .pair-column.danger .pair-column-header {
            background: #f8d7da;
            color: #721c24;
        }

        .pair-item {
            position: relative;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .pair-item:hover:not(.disabled) {
            border-color: #667eea;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .pair-item.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        .pair-item.matched {
            border-color: #28a745;
            opacity: 0.6;
        }

        .pair-item.disabled {
            cursor: not-allowed;
        }

        .pair-item-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .pair-item-label {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
        }

        .pair-item.selected .pair-item-label {
            background: #667eea;
            color: white;
        }

        .pair-item.matched .pair-item-label {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        /* Drag Drop Pair */
        .drag-drop-pair-container {
            margin-top: 20px;
        }

        .drag-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .drag-column {
            min-height: 300px;
        }

        .drag-column-header {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .drag-column.source .drag-column-header {
            background: #d1ecf1;
            color: #0c5460;
        }

        .drag-column.target .drag-column-header {
            background: #d4edda;
            color: #155724;
        }

        .drag-items-source, .drag-items-target {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 250px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #ccc;
        }

        .drag-items-target.drag-over {
            border-color: #28a745;
            background: #d4edda;
        }

        .drag-pair-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: move;
            transition: all 0.3s ease;
        }

        .drag-pair-item:hover {
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .drag-pair-item.dragging {
            opacity: 0.5;
        }

        .drag-pair-item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .drag-pair-item-text {
            flex: 1;
            font-weight: 500;
            color: #333;
        }

        .drag-pair-item-label {
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Text Image Match */
        .text-image-match-container {
            margin-top: 20px;
        }

        .match-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .match-column-text, .match-column-image {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .match-column-header {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #e7f3ff;
            color: #004085;
        }

        .match-text-item {
            padding: 15px;
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 500;
            position: relative;
        }

        .match-text-item:hover:not(.disabled) {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .match-text-item.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .match-text-item.matched {
            border-color: #28a745;
            opacity: 0.6;
        }

        .match-image-item {
            position: relative;
            border: 3px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .match-image-item:hover:not(.disabled) {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .match-image-item.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        .match-image-item.matched {
            border-color: #28a745;
            opacity: 0.6;
        }

        .match-image-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .match-item-label {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
            font-size: 14px;
        }

        .match-text-item.selected .match-item-label,
        .match-image-item.selected .match-item-label {
            background: #667eea;
            color: white;
        }

        .match-text-item.matched .match-item-label,
        .match-image-item.matched .match-item-label {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        /* Buttons */
        .submit-button, .next-button, .retry-button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-button:hover:not(:disabled), 
        .next-button:hover, 
        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Feedback */
        .feedback-message {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback-correct {
            background: #d4edda;
            color: #155724;
        }

        .feedback-incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .feedback-icon {
            font-size: 24px;
        }

        .explanation {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            color: #0c5460;
            line-height: 1.6;
        }

        .explanation strong {
            color: #004085;
        }

        /* Results */
        .results-container {
            text-align: center;
        }

        .results-header h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 30px;
        }

        .results-score {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .score-circle {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .score-circle svg {
            transform: rotate(-90deg);
        }

        .score-circle-bg {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 8;
        }

        .score-circle-fill {
            fill: none;
            stroke-width: 8;
            transition: stroke-dasharray 1s ease;
        }

        .score-circle.passed .score-circle-fill {
            stroke: #28a745;
        }

        .score-circle.failed .score-circle-fill {
            stroke: #dc3545;
        }

        .score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .score-percentage {
            font-size: 48px;
            font-weight: bold;
            color: #333;
        }

        .score-fraction {
            font-size: 18px;
            color: #666;
            margin-top: 5px;
        }

        .results-message {
            font-size: 20px;
            font-weight: 600;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .message-passed {
            background: #d4edda;
            color: #155724;
        }

        .message-failed {
            background: #f8d7da;
            color: #721c24;
        }

        /* Hint Button */
        .hint-button {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .hint-button:hover {
            background: #ffb300;
            transform: translateY(-2px);
        }

        .hint-content {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            color: #856404;
            animation: fadeIn 0.3s ease;
        }

        /* Image Single/Multi Choice */
        .image-answers-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .image-answer-option {
            position: relative;
            cursor: pointer;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            background: white;
        }

        .image-answer-option:hover:not(.disabled) {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .image-answer-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .image-answer-option.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .image-answer-option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .image-answer-option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .image-answer-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .image-answer-text {
            padding: 15px;
            text-align: center;
            font-weight: 500;
            color: #333;
            font-size: 15px;
        }

        .image-answer-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .image-answer-option.selected .image-answer-checkbox {
            background: #667eea;
            color: white;
        }

        .image-answer-option.correct .image-answer-checkbox {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        .image-answer-option.incorrect .image-answer-checkbox {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .quiz-container {
                padding: 20px;
            }

            .question-title {
                font-size: 18px;
            }

            .pair-columns {
                grid-template-columns: 1fr;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-percentage {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="quiz-container"></div>

    <script>
        // ===================================================================
        // QUIZ ENGINE - Đọc đúng format JSON của bạn
        // ===================================================================
        class QuizEngine {
            constructor(gameData) {
                this.gameData = gameData;
                this.questions = gameData.EachQuiz || [];
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.totalPoints = 0;
                this.maxPoints = gameData.main_total_max_points || 0;
                this.answers = [];
                this.container = null;
                this.currentAnswer = null;
                this.hintsUsed = new Set();
            }

            init(containerId) {
                this.container = document.getElementById(containerId);
                if (!this.container) {
                    console.error('Quiz container not found:', containerId);
                    return;
                }
                this.render();
            }

            render() {
                if (this.currentQuestionIndex < this.questions.length) {
                    this.renderQuestion();
                } else {
                    this.renderResults();
                }
            }

            renderQuestion() {
                const question = this.questions[this.currentQuestionIndex];
                const totalQuestions = this.questions.length;
                const questionNumber = this.currentQuestionIndex + 1;

                let questionHtml = '';
                switch (question.qtype) {
                    case 'mcq':
                        questionHtml = this.renderMCQ(question);
                        break;
                    case 'multi':
                        questionHtml = this.renderMultiChoice(question);
                        break;
                    case 'image_mcq':
                        questionHtml = this.renderImageMCQ(question);
                        break;
                    case 'image_multi':
                        questionHtml = this.renderImageMultiChoice(question);
                        break;
                    case 'hotspot':
                        questionHtml = this.renderHotspot(question);
                        break;
                    case 'order':
                        questionHtml = this.renderOrder(question);
                        break;
                    case 'image_pair':
                        questionHtml = this.renderImagePair(question);
                        break;
                    case 'drag_drop_pair':
                        questionHtml = this.renderDragDropPair(question);
                        break;

            attachEventListeners(question) {

                        break;
                    case 'image_multi':
                        this.attachImageMultiChoiceListeners(question);
                        break;
                    case 'hotspot':

                        break;
                    case 'order':
                        this.attachOrderListeners(question);
                        break;
                    case 'image_pair':
                        this.attachImagePairListeners(question);
                        break;

            attachMCQListeners(question) {
                const options = this.container.querySelectorAll('.text-answer-option');
                options.forEach((option, index) => {
                    option.addEventListener('click', () => {
                        if (option.classList.contains('disabled')) return;
                        
                        const isCorrect = question.opt_array[index] === question.sol_array;
                        const points = isCorrect ? question.pmax : 0;
                        
                        this.currentAnswer = { selected: [index], isCorrect };
                        
                        options.forEach(opt => opt.classList.add('disabled'));
                        option.classList.add(isCorrect ? 'correct' : 'incorrect');
                        
                        if (!isCorrect) {
                            const correctIndex = question.opt_array.indexOf(question.sol_array);
                            if (correctIndex !== -1) {
                                options[correctIndex].classList.add('correct');
                            }
                        }
                        
                        this.showFeedback(isCorrect, points, question);
                    });
                });
            }

            attachMultiChoiceListeners(question) {
                const options = this.container.querySelectorAll('.text-answer-option');
                const submitBtn = this.container.querySelector('#submit-multi');
                const selected = new Set();

                options.forEach((option, index) => {
                    option.addEventListener('click', () => {
                        if (option.classList.contains('disabled')) return;
                        
                        const answer = question.opt_array[index];
                        if (selected.has(answer)) {
                            selected.delete(answer);
                            option.classList.remove('selected');
                            option.querySelector('.answer-checkbox').textContent = '☐';
                        } else {
                            selected.add(answer);
                            option.classList.add('selected');
                            option.querySelector('.answer-checkbox').textContent = '☑';
                        }

                        submitBtn.disabled = selected.size === 0;
                    });
                });

                submitBtn.addEventListener('click', () => {
                    const correctSet = new Set(question.sol_array);
                    const isCorrect = selected.size === correctSet.size && 
                                     [...selected].every(i => correctSet.has(i));
                    const points = isCorrect ? question.pmax : 0;
                    
                    this.currentAnswer = { selected: Array.from(selected), isCorrect };
                    
                    options.forEach((opt, idx) => {
                        opt.classList.add('disabled');
                        const answer = question.opt_array[idx];
                        if (correctSet.has(answer)) {
                            opt.classList.add('correct');
                        } else if (selected.has(answer)) {
                            opt.classList.add('incorrect');
                        }
                    });
                    
                    submitBtn.disabled = true;
                    this.showFeedback(isCorrect, points, question);
                });
            }

            attachImageMCQListeners(question) {
                const options = this.container.querySelectorAll('.image-answer-option');
                options.forEach((option, index) => {
                    option.addEventListener('click', () => {
                        if (option.classList.contains('disabled')) return;
                        
                        const isCorrect = index === question.sol_array;
                        const points = isCorrect ? question.pmax : 0;
                        
                        this.currentAnswer = { selected: [index], isCorrect };
                        
                        options.forEach(opt => opt.classList.add('disabled'));
                        option.classList.add(isCorrect ? 'correct' : 'incorrect');
                        option.querySelector('.image-answer-checkbox').textContent = isCorrect ? '✓' : '✗';
                        
                        if (!isCorrect) {
                            options[question.sol_array].classList.add('correct');
                            options[question.sol_array].querySelector('.image-answer-checkbox').textContent = '✓';

                        this.showFeedback(isCorrect, points, question);

                    this.currentAnswer = { selected: Array.from(selected), isCorrect };

            attachHotspotListeners(question) {
                const overlay = this.container.querySelector('#hotspot-overlay');
                const img = this.container.querySelector('#hotspot-img');
                let clicked = false;

                overlay.addEventListener('click', (e) => {
                    if (clicked) return;

                    const rect = img.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;

                    // Tính toán theo tỷ lệ pixel thực tế của ảnh
                    const scaleX = img.naturalWidth / rect.width;
                    const scaleY = img.naturalHeight / rect.height;
                    const actualX = clickX * scaleX;
                    const actualY = clickY * scaleY;

                    // So sánh với sol_json
                    const correctX = question.sol_json.x;
                    const correctY = question.sol_json.y;
                    const radius = question.sol_json.radius;

                    const distance = Math.sqrt(
                        Math.pow(actualX - correctX, 2) + 
                        Math.pow(actualY - correctY, 2)
                    );

                    const isCorrect = distance <= radius;
                    const points = isCorrect ? question.pmax : 0;

                    // Hiển thị điểm click
                    const clickPoint = document.createElement('div');
                    clickPoint.className = `hotspot-click-point ${isCorrect ? 'correct' : 'incorrect'}`;
                    clickPoint.style.left = `${(clickX / rect.width) * 100}%`;
                    clickPoint.style.top = `${(clickY / rect.height) * 100}%`;
                    clickPoint.textContent = isCorrect ? '✓' : '✗';
                    overlay.appendChild(clickPoint);

                    // Hiển thị điểm đúng nếu sai
                    if (!isCorrect) {
                        const correctPoint = document.createElement('div');
                        correctPoint.className = 'hotspot-click-point correct';
                        correctPoint.style.left = `${(correctX / img.naturalWidth) * 100}%`;
                        correctPoint.style.top = `${(correctY / img.naturalHeight) * 100}%`;
                        correctPoint.textContent = '✓';
                        overlay.appendChild(correctPoint);
                    }

                    clicked = true;
                    overlay.style.cursor = 'default';
                    this.currentAnswer = { clickX: actualX, clickY: actualY, isCorrect };
                    this.showFeedback(isCorrect, points, question);
                });
            }

            attachOrderListeners(question) {
                const items = this.container.querySelectorAll('.order-item');
                const submitBtn = this.container.querySelector('#submit-order');
                let draggedElement = null;

                items.forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        draggedElement = item;
                        item.classList.add('dragging');
                    });

                    item.addEventListener('dragend', () => {
                        item.classList.remove('dragging');
                    });

                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        const afterElement = this.getDragAfterElement(this.container.querySelector('#order-items'), e.clientY);
                        const container = this.container.querySelector('#order-items');
                        if (afterElement == null) {
                            container.appendChild(draggedElement);
                        } else {
                            container.insertBefore(draggedElement, afterElement);
                        }
                        this.updateOrderNumbers();
                    });
                });

                submitBtn.addEventListener('click', () => {
                    const currentOrder = Array.from(this.container.querySelectorAll('.order-item'))
                        .map(item => item.dataset.text);
                    
                    const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(question.sol_array);
                    const points = isCorrect ? question.pmax : 0;
                    
                    this.currentAnswer = { order: currentOrder, isCorrect };
                    
                    items.forEach(item => {
                        item.classList.add('disabled');
                        item.setAttribute('draggable', 'false');
                    });
                    
                    submitBtn.disabled = true;
                    this.showFeedback(isCorrect, points, question);
                });
            }

            updateOrderNumbers() {
                const currentItems = this.container.querySelectorAll('.order-item');
                currentItems.forEach((item, index) => {
                    item.querySelector('.order-number').textContent = index + 1;
                });
            }

            getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.order-item:not(.dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            attachImagePairListeners(question) {
                const items = this.container.querySelectorAll('.pair-item');
                const submitBtn = this.container.querySelector('#submit-pair');
                let firstSelected = null;
                const pairs = [];

                items.forEach(item => {
                    item.addEventListener('click', () => {
                        if (item.classList.contains('matched') || item.classList.contains('disabled')) return;

                        if (!firstSelected) {
                            firstSelected = item;
                            item.classList.add('selected');
                        } else {
                            if (firstSelected === item) {
                                firstSelected.classList.remove('selected');
                                firstSelected = null;
                                return;
                            }

                            // Kiểm tra nếu từ 2 nhóm khác nhau
                            if (firstSelected.dataset.group !== item.dataset.group) {
                                const safeIndex = firstSelected.dataset.group === 'safe' 
                                    ? parseInt(firstSelected.dataset.index) 
                                    : parseInt(item.dataset.index);
                                const dangerIndex = firstSelected.dataset.group === 'danger' 
                                    ? parseInt(firstSelected.dataset.index) 
                                    : parseInt(item.dataset.index);

                                pairs.push([safeIndex, dangerIndex]);
                                
                                firstSelected.classList.add('matched');
                                firstSelected.classList.remove('selected');
                                item.classList.add('matched');
                                
                                firstSelected = null;

                                submitBtn.disabled = pairs.length !== 3;
                            } else {
                                firstSelected.classList.remove('selected');
                                firstSelected = item;
                                item.classList.add('selected');
                            }
                        }
                    });
                });

                submitBtn.addEventListener('click', () => {
                    // Kiểm tra theo sol_array của question
                    let correctCount = 0;
                    pairs.forEach(pair => {
                        if (pair[0] === pair[1]) correctCount++;
                    });

                    const isCorrect = correctCount === 3;
                    const points = isCorrect ? question.pmax : Math.floor(question.pmax * (correctCount / 3));
                    
                    this.currentAnswer = { pairs, isCorrect, correctCount };
                    
                    items.forEach(item => item.classList.add('disabled'));
                    submitBtn.disabled = true;
                    
                    this.showFeedback(isCorrect, points, question, `Bạn ghép đúng ${correctCount}/3 cặp`);
                });
            }

            attachDragDropPairListeners(question) {
                const sourceItems = this.container.querySelectorAll('.drag-pair-item');
                const targetZone = this.container.querySelector('#drag-target');
                const submitBtn = this.container.querySelector('#submit-drag-pair');
                let draggedElement = null;
                const droppedItems = [];

                sourceItems.forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        draggedElement = item;
                        item.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    });

                    item.addEventListener('dragend', () => {
                        item.classList.remove('dragging');
                    });
                });

                targetZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    targetZone.classList.add('drag-over');
                });

                targetZone.addEventListener('dragleave', () => {
                    targetZone.classList.remove('drag-over');
                });

                targetZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    targetZone.classList.remove('drag-over');

                    if (draggedElement && !droppedItems.includes(draggedElement.dataset.id)) {
                        const clone = draggedElement.cloneNode(true);
                        clone.setAttribute('draggable', 'false');
                        clone.style.opacity = '0.6';
                        targetZone.appendChild(clone);
                        
                        droppedItems.push(draggedElement.dataset.id);
                        draggedElement.style.opacity = '0.3';
                        draggedElement.setAttribute('draggable', 'false');

                        submitBtn.disabled = droppedItems.length !== question.left_items.length;
                    }
                });

                submitBtn.addEventListener('click', () => {
                    const targetOrder = Array.from(targetZone.querySelectorAll('.drag-pair-item'))
                        .map(item => item.dataset.id);
                    
                    const correctOrder = question.sol_array || [];
                    let correctCount = 0;
                    
                    targetOrder.forEach((id, index) => {
                        if (correctOrder[index] === id) correctCount++;
                    });

                    const isCorrect = correctCount === correctOrder.length;
                    const points = isCorrect ? question.pmax : Math.floor(question.pmax * (correctCount / correctOrder.length));

                    this.currentAnswer = { order: targetOrder, isCorrect, correctCount };
                    submitBtn.disabled = true;

                    this.showFeedback(isCorrect, points, question, `Bạn sắp xếp đúng ${correctCount}/${correctOrder.length} vị trí`);
                });
            }

            attachTextImageMatchListeners(question) {
                const textItems = this.container.querySelectorAll('.match-text-item');
                const imageItems = this.container.querySelectorAll('.match-image-item');
                const submitBtn = this.container.querySelector('#submit-text-image-match');
                let firstSelected = null;
                const pairs = [];

                const allItems = [...textItems, ...imageItems];

                allItems.forEach(item => {
                    item.addEventListener('click', () => {
                        if (item.classList.contains('matched') || item.classList.contains('disabled')) return;

                        if (!firstSelected) {
                            firstSelected = item;
                            item.classList.add('selected');
                        } else {
                            if (firstSelected === item) {
                                firstSelected.classList.remove('selected');
                                firstSelected = null;
                                return;
                            }

                            // Check if from different groups
                            if (firstSelected.dataset.group !== item.dataset.group) {
                                const textId = firstSelected.dataset.group === 'text' 
                                    ? firstSelected.dataset.id 
                                    : item.dataset.id;
                                const imageId = firstSelected.dataset.group === 'image' 
                                    ? firstSelected.dataset.id 
                                    : item.dataset.id;

                                pairs.push([textId, imageId]);
                                
                                firstSelected.classList.add('matched');
                                firstSelected.classList.remove('selected');
                                item.classList.add('matched');
                                
                                firstSelected = null;

                                const totalPairs = question.text_items.length;
                                submitBtn.disabled = pairs.length !== totalPairs;
                            } else {
                                firstSelected.classList.remove('selected');
                                firstSelected = item;
                                item.classList.add('selected');
                            }
                        }
                    });
                });

                submitBtn.addEventListener('click', () => {
                    const correctPairs = question.sol_array || [];
                    let correctCount = 0;

                    pairs.forEach(pair => {
                        const isCorrect = correctPairs.some(cp => 
                            (cp[0] === pair[0] && cp[1] === pair[1]) ||
                            (cp[0] === pair[1] && cp[1] === pair[0])
                        );
                        if (isCorrect) correctCount++;
                    });

                    const isCorrect = correctCount === correctPairs.length;
                    const points = isCorrect ? question.pmax : Math.floor(question.pmax * (correctCount / correctPairs.length));

                    this.currentAnswer = { pairs, isCorrect, correctCount };
                    allItems.forEach(item => item.classList.add('disabled'));
                    submitBtn.disabled = true;

                    this.showFeedback(isCorrect, points, question, `Bạn ghép đúng ${correctCount}/${correctPairs.length} cặp`);
                });
            }

            showFeedback(isCorrect, points, question, customMessage = '') {
                if (isCorrect) {
                    this.score++;
                }

                // Áp dụng hint penalty
                if (this.hintsUsed.has(question.qid) && points > 0) {
                    const penalty = question.hint_penalty_percent || 0;
                    points = Math.floor(points * (1 - penalty / 100));
                }

                this.totalPoints += points;

                this.answers.push({
                    questionIndex: this.currentQuestionIndex,
                    qid: question.qid,
                    answer: this.currentAnswer,
                    isCorrect: isCorrect,
                    points: points,
                    maxPoints: question.pmax
                });

                const message = customMessage || (isCorrect ? 'Chính xác! ✓' : 'Chưa chính xác! ✗');
                
                const feedbackHtml = `
                    <div class="feedback-message ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}">
                        <span class="feedback-icon">${isCorrect ? '✓' : '✗'}</span>
                        <span class="feedback-text">${message} (+${points}/${question.pmax} điểm)</span>
                    </div>
                    ${question.expl && question.display_correct_answer === 'y' ? `
                        <div class="explanation">
                            <strong>💡 Giải thích:</strong> ${question.expl}
                        </div>
                    ` : ''}
                `;

                const questionContainer = this.container.querySelector('.question-container');
                questionContainer.insertAdjacentHTML('beforeend', feedbackHtml);

                const nextButton = document.createElement('button');
                nextButton.className = 'next-button';
                nextButton.textContent = this.currentQuestionIndex < this.questions.length - 1 
                    ? 'Câu tiếp theo →' 
                    : 'Xem kết quả 🎯';
                nextButton.addEventListener('click', () => this.nextQuestion());
                questionContainer.appendChild(nextButton);
            }

            nextQuestion() {
                this.currentQuestionIndex++;
                this.currentAnswer = null;
                this.render();
            }
