<!-- Quiz App - Phiên bản nhúng vào trang web -->
<!-- Copy toàn bộ code này và paste vào trang web của bạn -->

<style>
    /* Isolated CSS - Không ảnh hưởng đến trang web gốc */
    .quiz-app-wrapper {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        width: 100% !important;
        max-width: 800px !important;
        margin: 0 auto !important;
        padding: 20px !important;
        box-sizing: border-box !important;
    }

    .quiz-app-wrapper * {
        box-sizing: border-box !important;
    }

    .quiz-app-wrapper .quiz-container {
        background: white !important;
        border-radius: 20px !important;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3) !important;
        padding: 40px !important;
        animation: quizSlideIn 0.5s ease-out !important;
        margin: 0 !important;
    }

    @keyframes quizSlideIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Progress Bar */
    .quiz-app-wrapper .quiz-progress {
        margin-bottom: 30px !important;
    }

    .quiz-app-wrapper .progress-bar {
        width: 100% !important;
        height: 8px !important;
        background: #e0e0e0 !important;
        border-radius: 10px !important;
        overflow: hidden !important;
        margin-bottom: 10px !important;
    }

    .quiz-app-wrapper .progress-fill {
        height: 100% !important;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%) !important;
        transition: width 0.3s ease !important;
        border-radius: 10px !important;
    }

    .quiz-app-wrapper .progress-text {
        text-align: center !important;
        color: #666 !important;
        font-size: 14px !important;
        font-weight: 600 !important;
        margin: 0 !important;
    }

    /* Question */
    .quiz-app-wrapper .question-container {
        margin-bottom: 20px !important;
    }

    .quiz-app-wrapper .question-title {
        font-size: 24px !important;
        color: #333 !important;
        margin-bottom: 30px !important;
        line-height: 1.5 !important;
        font-weight: 600 !important;
    }

    /* Answers */
    .quiz-app-wrapper .answers-container {
        display: flex !important;
        flex-direction: column !important;
        gap: 15px !important;
    }

    .quiz-app-wrapper .answer-option {
        display: flex !important;
        align-items: center !important;
        padding: 20px !important;
        background: #f8f9fa !important;
        border: 2px solid #e0e0e0 !important;
        border-radius: 12px !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
        font-size: 16px !important;
        text-align: left !important;
        width: 100% !important;
        margin: 0 !important;
    }

    .quiz-app-wrapper .answer-option:hover:not(:disabled) {
        background: #f0f0f0 !important;
        border-color: #667eea !important;
        transform: translateX(5px) !important;
    }

    .quiz-app-wrapper .answer-option:disabled {
        cursor: not-allowed !important;
    }

    .quiz-app-wrapper .answer-letter {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 40px !important;
        height: 40px !important;
        background: #667eea !important;
        color: white !important;
        border-radius: 50% !important;
        font-weight: bold !important;
        margin-right: 15px !important;
        flex-shrink: 0 !important;
    }

    .quiz-app-wrapper .answer-text {
        flex: 1 !important;
        color: #333 !important;
    }

    /* Correct/Incorrect states */
    .quiz-app-wrapper .answer-option.correct {
        background: #d4edda !important;
        border-color: #28a745 !important;
        animation: quizBounceIn 0.5s ease !important;
    }

    .quiz-app-wrapper .answer-option.correct .answer-letter {
        background: #28a745 !important;
    }

    .quiz-app-wrapper .answer-option.incorrect {
        background: #f8d7da !important;
        border-color: #dc3545 !important;
        animation: quizShake 0.5s ease !important;
    }

    .quiz-app-wrapper .answer-option.incorrect .answer-letter {
        background: #dc3545 !important;
    }

    @keyframes quizBounceIn {
        0% { transform: scale(0.9); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    @keyframes quizShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    /* Feedback Message */
    .quiz-app-wrapper .feedback-message {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 10px !important;
        padding: 15px !important;
        border-radius: 10px !important;
        margin-top: 20px !important;
        font-weight: 600 !important;
        animation: quizFadeIn 0.3s ease !important;
    }

    @keyframes quizFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .quiz-app-wrapper .feedback-correct {
        background: #d4edda !important;
        color: #155724 !important;
    }

    .quiz-app-wrapper .feedback-incorrect {
        background: #f8d7da !important;
        color: #721c24 !important;
    }

    .quiz-app-wrapper .feedback-icon {
        font-size: 24px !important;
    }

    /* Buttons */
    .quiz-app-wrapper .next-button, 
    .quiz-app-wrapper .retry-button {
        width: 100% !important;
        padding: 15px !important;
        margin-top: 20px !important;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        color: white !important;
        border: none !important;
        border-radius: 10px !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
    }

    .quiz-app-wrapper .next-button:hover, 
    .quiz-app-wrapper .retry-button:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4) !important;
    }

    .quiz-app-wrapper .next-button:active, 
    .quiz-app-wrapper .retry-button:active {
        transform: translateY(0) !important;
    }

    /* Current Score */
    .quiz-app-wrapper .current-score {
        text-align: center !important;
        margin-top: 20px !important;
        color: #666 !important;
        font-weight: 600 !important;
    }

    /* Results */
    .quiz-app-wrapper .results-container {
        text-align: center !important;
    }

    .quiz-app-wrapper .results-header h2 {
        font-size: 32px !important;
        color: #333 !important;
        margin-bottom: 30px !important;
    }

    .quiz-app-wrapper .results-score {
        display: flex !important;
        justify-content: center !important;
        margin-bottom: 30px !important;
    }

    .quiz-app-wrapper .score-circle {
        position: relative !important;
        width: 200px !important;
        height: 200px !important;
    }

    .quiz-app-wrapper .score-circle svg {
        transform: rotate(-90deg) !important;
    }

    .quiz-app-wrapper .score-circle-bg {
        fill: none !important;
        stroke: #e0e0e0 !important;
        stroke-width: 8 !important;
    }

    .quiz-app-wrapper .score-circle-fill {
        fill: none !important;
        stroke-width: 8 !important;
        transition: stroke-dasharray 1s ease !important;
    }

    .quiz-app-wrapper .score-circle.passed .score-circle-fill {
        stroke: #28a745 !important;
    }

    .quiz-app-wrapper .score-circle.failed .score-circle-fill {
        stroke: #dc3545 !important;
    }

    .quiz-app-wrapper .score-text {
        position: absolute !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) !important;
        text-align: center !important;
    }

    .quiz-app-wrapper .score-percentage {
        font-size: 48px !important;
        font-weight: bold !important;
        color: #333 !important;
    }

    .quiz-app-wrapper .score-fraction {
        font-size: 18px !important;
        color: #666 !important;
        margin-top: 5px !important;
    }

    .quiz-app-wrapper .results-message {
        font-size: 20px !important;
        font-weight: 600 !important;
        padding: 20px !important;
        border-radius: 10px !important;
        margin-bottom: 30px !important;
    }

    .quiz-app-wrapper .message-passed {
        background: #d4edda !important;
        color: #155724 !important;
    }

    .quiz-app-wrapper .message-failed {
        background: #f8d7da !important;
        color: #721c24 !important;
    }

    /* Results Details */
    .quiz-app-wrapper .results-details {
        text-align: left !important;
        margin-top: 30px !important;
        max-height: 400px !important;
        overflow-y: auto !important;
        padding: 10px !important;
    }

    .quiz-app-wrapper .results-details h3 {
        font-size: 20px !important;
        color: #333 !important;
        margin-bottom: 20px !important;
    }

    .quiz-app-wrapper .result-item {
        padding: 15px !important;
        margin-bottom: 15px !important;
        border-radius: 10px !important;
        border-left: 4px solid !important;
    }

    .quiz-app-wrapper .result-correct {
        background: #d4edda !important;
        border-color: #28a745 !important;
    }

    .quiz-app-wrapper .result-incorrect {
        background: #f8d7da !important;
        border-color: #dc3545 !important;
    }

    .quiz-app-wrapper .result-question {
        display: flex !important;
        align-items: center !important;
        gap: 10px !important;
        font-weight: 600 !important;
        margin-bottom: 10px !important;
        color: #333 !important;
    }

    .quiz-app-wrapper .result-icon {
        font-size: 20px !important;
    }

    .quiz-app-wrapper .result-answer {
        font-size: 14px !important;
        color: #666 !important;
        margin-left: 30px !important;
    }

    .quiz-app-wrapper .result-answer strong {
        color: #333 !important;
    }

    .quiz-app-wrapper .result-answer div {
        margin: 5px 0 !important;
    }

    /* Scrollbar */
    .quiz-app-wrapper .results-details::-webkit-scrollbar {
        width: 8px !important;
    }

    .quiz-app-wrapper .results-details::-webkit-scrollbar-track {
        background: #f1f1f1 !important;
        border-radius: 10px !important;
    }

    .quiz-app-wrapper .results-details::-webkit-scrollbar-thumb {
        background: #888 !important;
        border-radius: 10px !important;
    }

    .quiz-app-wrapper .results-details::-webkit-scrollbar-thumb:hover {
        background: #555 !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .quiz-app-wrapper .quiz-container {
            padding: 20px !important;
        }

        .quiz-app-wrapper .question-title {
            font-size: 20px !important;
        }

        .quiz-app-wrapper .answer-option {
            padding: 15px !important;
            font-size: 14px !important;
        }

        .quiz-app-wrapper .answer-letter {
            width: 35px !important;
            height: 35px !important;
            font-size: 14px !important;
        }

        .quiz-app-wrapper .score-circle {
            width: 150px !important;
            height: 150px !important;
        }

        .quiz-app-wrapper .score-percentage {
            font-size: 36px !important;
        }

        .quiz-app-wrapper .results-header h2 {
            font-size: 24px !important;
        }
    }
</style>

<!-- Quiz Container -->
<div class="quiz-app-wrapper">
    <div id="quiz-container-embedded"></div>
</div>

<script>
/**
 * Global Quiz Script - Pure JavaScript Implementation
 */

class QuizEngine {
    constructor(config) {
        this.config = config;
        this.currentQuestionIndex = 0;
        this.score = 0;
        this.answers = [];
        this.container = null;
    }

    init(containerId) {
        this.container = document.getElementById(containerId);
        if (!this.container) {
            console.error('Quiz container not found:', containerId);
            return;
        }
        this.render();
    }

    render() {
        if (this.currentQuestionIndex < this.config.questions.length) {
            this.renderQuestion();
        } else {
            this.renderResults();
        }
    }

    renderQuestion() {
        const question = this.config.questions[this.currentQuestionIndex];
        const totalQuestions = this.config.questions.length;
        const questionNumber = this.currentQuestionIndex + 1;

        const html = `
            <div class="quiz-container" role="main" aria-label="Quiz">
                <div class="quiz-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${(questionNumber / totalQuestions) * 100}%"></div>
                    </div>
                    <div class="progress-text">Câu ${questionNumber} / ${totalQuestions}</div>
                </div>

                <div class="question-container">
                    <h2 class="question-title">${question.question}</h2>
                    
                    <div class="answers-container">
                        ${question.answers.map((answer, index) => `
                            <button 
                                class="answer-option" 
                                data-index="${index}"
                                aria-label="Answer option ${index + 1}"
                            >
                                <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
                                <span class="answer-text">${answer}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>

                ${this.config.showScore ? `
                    <div class="current-score">
                        Điểm hiện tại: ${this.score} / ${this.currentQuestionIndex}
                    </div>
                ` : ''}
            </div>
        `;

        this.container.innerHTML = html;
        this.attachAnswerListeners();
    }

    attachAnswerListeners() {
        const buttons = this.container.querySelectorAll('.answer-option');
        buttons.forEach((button, index) => {
            button.addEventListener('click', () => this.selectAnswer(index));
        });
    }

    selectAnswer(answerIndex) {
        const question = this.config.questions[this.currentQuestionIndex];
        const isCorrect = answerIndex === question.correctAnswer;
        
        this.answers.push({
            questionIndex: this.currentQuestionIndex,
            answerIndex: answerIndex,
            isCorrect: isCorrect
        });

        if (isCorrect) {
            this.score++;
        }

        this.showFeedback(answerIndex, isCorrect);
    }

    showFeedback(selectedIndex, isCorrect) {
        const buttons = this.container.querySelectorAll('.answer-option');
        const question = this.config.questions[this.currentQuestionIndex];
        
        buttons.forEach(btn => btn.disabled = true);

        buttons[selectedIndex].classList.add(isCorrect ? 'correct' : 'incorrect');
        
        if (!isCorrect) {
            buttons[question.correctAnswer].classList.add('correct');
        }

        const feedbackHtml = `
            <div class="feedback-message ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}">
                <span class="feedback-icon">${isCorrect ? '✓' : '✗'}</span>
                <span class="feedback-text">${isCorrect ? this.config.l10n.correctText : this.config.l10n.incorrectText}</span>
            </div>
        `;

        const questionContainer = this.container.querySelector('.question-container');
        questionContainer.insertAdjacentHTML('beforeend', feedbackHtml);

        const nextButton = document.createElement('button');
        nextButton.className = 'next-button';
        nextButton.textContent = this.currentQuestionIndex < this.config.questions.length - 1 
            ? this.config.l10n.nextButtonLabel 
            : this.config.l10n.finishButtonLabel;
        nextButton.addEventListener('click', () => this.nextQuestion());
        questionContainer.appendChild(nextButton);
    }

    nextQuestion() {
        this.currentQuestionIndex++;
        this.render();
    }

    renderResults() {
        const totalQuestions = this.config.questions.length;
        const percentage = Math.round((this.score / totalQuestions) * 100);
        const passed = percentage >= this.config.passPercentage;

        const html = `
            <div class="quiz-container results-container">
                <div class="results-header">
                    <h2>${this.config.l10n.resultsTitle}</h2>
                </div>

                <div class="results-score">
                    <div class="score-circle ${passed ? 'passed' : 'failed'}">
                        <svg viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" class="score-circle-bg"></circle>
                            <circle cx="50" cy="50" r="45" class="score-circle-fill" 
                                style="stroke-dasharray: ${percentage * 2.827}, 282.7"></circle>
                        </svg>
                        <div class="score-text">
                            <div class="score-percentage">${percentage}%</div>
                            <div class="score-fraction">${this.score} / ${totalQuestions}</div>
                        </div>
                    </div>
                </div>

                <div class="results-message ${passed ? 'message-passed' : 'message-failed'}">
                    ${passed ? this.config.l10n.passedMessage : this.config.l10n.failedMessage}
                </div>

                <div class="results-details">
                    <h3>${this.config.l10n.reviewTitle}</h3>
                    ${this.config.questions.map((question, index) => `
                        <div class="result-item ${this.answers[index].isCorrect ? 'result-correct' : 'result-incorrect'}">
                            <div class="result-question">
                                <span class="result-icon">${this.answers[index].isCorrect ? '✓' : '✗'}</span>
                                <span>Câu ${index + 1}: ${question.question}</span>
                            </div>
                            <div class="result-answer">
                                ${!this.answers[index].isCorrect ? `
                                    <div>Bạn chọn: <strong>${question.answers[this.answers[index].answerIndex]}</strong></div>
                                    <div>Đáp án đúng: <strong>${question.answers[question.correctAnswer]}</strong></div>
                                ` : `
                                    <div>Bạn đã chọn đúng: <strong>${question.answers[question.correctAnswer]}</strong></div>
                                `}
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="results-actions">
                    <button class="retry-button" onclick="location.reload()">
                        ${this.config.l10n.retryButtonLabel}
                    </button>
                </div>
            </div>
        `;

        this.container.innerHTML = html;
    }
}

function initQuiz(config, containerId) {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            const quiz = new QuizEngine(config);
            quiz.init(containerId);
        });
    } else {
        const quiz = new QuizEngine(config);
        quiz.init(containerId);
    }
}

// Quiz configuration and question data
const quizConfig = {
    questions: [
        {
            question: "Chọn tình huống nguy cơ khi làm việc với máy móc?",
            answers: [

            ],
            correctAnswer: 1
        },
        {
            question: "Hành động nào thể hiện an toàn lao động?",
            answers: [
                "Làm việc không cần nghỉ ngơi để hoàn thành sớm",

                "Tuân thủ quy trình an toàn lao động",
                "Bỏ qua các biển báo nguy hiểm"
            ],
            correctAnswer: 2
        },
        {
            question: "Khi xảy ra cháy nổ, bạn cần làm gì đầu tiên?",
            answers: [
                "Chạy về nhà lấy đồ đạc",
                "Kêu cứu và báo động khẩn cấp",
                "Chụp ảnh đăng lên mạng xã hội",
                "Đứng xem và quay video"
            ],
            correctAnswer: 1
        },
        {
            question: "Thiết bị bảo hộ nào BẮT BUỘC khi làm việc ở công trường xây dựng?",
            answers: [
                "Mũ bảo hiểm",
                "Tai nghe bluetooth",
                "Đồng hồ thông minh",
                "Kính thời trang"
            ],
            correctAnswer: 0
        },
        {
            question: "Biển báo nào chỉ thị nguy hiểm điện áp cao?",
            answers: [
                "Biển hình tròn màu xanh",
                "Biển hình tam giác màu vàng với hình tia chớp",
                "Biển hình vuông màu đỏ",
                "Biển hình chữ nhật màu trắng"
            ],
            correctAnswer: 1
        }
    ],

    passPercentage: 60,
    showScore: false,

    l10n: {
        nextButtonLabel: "Câu tiếp theo",
        finishButtonLabel: "Hoàn thành",
        retryButtonLabel: "Làm lại",
        correctText: "Chính xác!",
        incorrectText: "Chưa chính xác!",
        resultsTitle: "Kết quả Quiz",
        reviewTitle: "Xem lại các câu hỏi",
        passedMessage: "🎉 Chúc mừng! Bạn đã vượt qua bài kiểm tra!",
        failedMessage: "😔 Bạn chưa đạt yêu cầu. Hãy thử lại nhé!"
    }
};

// Initialize quiz
initQuiz(quizConfig, 'quiz-container-embedded');
</script>
