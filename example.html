<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quiz an toàn giao thông - Procfu.com">
    <title>Quiz Hoàn Chỉnh - 12 Câu Hỏi</title>
    
    <!-- ========== GLOBAL CSS ========== -->
    <!-- Nhúng file CSS chung cho tất cả quiz -->
    <link rel="stylesheet" href="global-quiz.css">
    
    <!-- ========== LOCAL CSS ========== -->
    <!-- Nhúng file CSS đặc thù cho quiz này (có thể để trống hoặc tùy chỉnh) -->
    <link rel="stylesheet" href="local-quiz-complete.css">
</head>
<body>
    <!-- ========== QUIZ CONTAINER ========== -->
    <!-- Container này sẽ chứa toàn bộ quiz -->
    <div id="quiz-container"></div>
    
    <!-- ========== JAVASCRIPT - THỨ TỰ QUAN TRỌNG ========== -->
    
    <!-- 1. Global JS Engine (core quiz engine) -->
    <script src="global-quiz.js"></script>
    
    <!-- 2. Local Data Input (dữ liệu quiz) -->
    <script src="local_datainput.js"></script>
    
    <!-- 3. Local JS Init (khởi tạo quiz) -->
    <script src="local-quiz-complete.js"></script>
    
    <!-- ========== DEBUG INFO ========== -->
    <script>
        console.log('📦 Quiz System Status:');
        console.log('  ✅ QuizEngine:', typeof QuizEngine !== 'undefined' ? 'Loaded' : '❌ Missing');
        console.log('  ✅ Quiz Data:', typeof window.quizData !== 'undefined' ? 'Loaded' : '❌ Missing');
        console.log('  ✅ Container:', document.getElementById('quiz-container') ? 'Ready' : '❌ Missing');
    </script>
</body>
</html>
