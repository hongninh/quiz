<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Kiểm Tra Kiến Thức</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #quiz-container {
            width: 100%;
            max-width: 800px;
        }

        .quiz-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress Bar */
        .quiz-progress {
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        /* Question */
        .question-container {
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Answers */
        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .answer-option {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            text-align: left;
            width: 100%;
        }

        .answer-option:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .answer-option:disabled {
            cursor: not-allowed;
        }

        .answer-letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .answer-text {
            flex: 1;
            color: #333;
        }

        /* Correct/Incorrect states */
        .answer-option.correct {
            background: #d4edda;
            border-color: #28a745;
            animation: bounceIn 0.5s ease;
        }

        .answer-option.correct .answer-letter {
            background: #28a745;
        }

        .answer-option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            animation: shake 0.5s ease;
        }

        .answer-option.incorrect .answer-letter {
            background: #dc3545;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Feedback Message */
        .feedback-message {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .feedback-correct {
            background: #d4edda;
            color: #155724;
        }

        .feedback-incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .feedback-icon {
            font-size: 24px;
        }

        /* Buttons */
        .next-button, .retry-button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-button:hover, .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .next-button:active, .retry-button:active {
            transform: translateY(0);
        }

        /* Current Score */
        .current-score {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-weight: 600;
        }

        /* Results */
        .results-container {
            text-align: center;
        }

        .results-header h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 30px;
        }

        .results-score {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .score-circle {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .score-circle svg {
            transform: rotate(-90deg);
        }

        .score-circle-bg {
            fill: none;
            stroke: #e0e0e0;
            stroke-width: 8;
        }

        .score-circle-fill {
            fill: none;
            stroke-width: 8;
            transition: stroke-dasharray 1s ease;
        }

        .score-circle.passed .score-circle-fill {
            stroke: #28a745;
        }

        .score-circle.failed .score-circle-fill {
            stroke: #dc3545;
        }

        .score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .score-percentage {
            font-size: 48px;
            font-weight: bold;
            color: #333;
        }

        .score-fraction {
            font-size: 18px;
            color: #666;
            margin-top: 5px;
        }

        .results-message {
            font-size: 20px;
            font-weight: 600;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .message-passed {
            background: #d4edda;
            color: #155724;
        }

        .message-failed {
            background: #f8d7da;
            color: #721c24;
        }

        /* Results Details */
        .results-details {
            text-align: left;
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .results-details h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid;
        }

        .result-correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .result-incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .result-question {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .result-icon {
            font-size: 20px;
        }

        .result-answer {
            font-size: 14px;
            color: #666;
            margin-left: 30px;
        }

        .result-answer strong {
            color: #333;
        }

        /* Scrollbar */
        .results-details::-webkit-scrollbar {
            width: 8px;
        }

        .results-details::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .results-details::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .results-details::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .quiz-container {
                padding: 20px;
            }

            .question-title {
                font-size: 20px;
            }

            .answer-option {
                padding: 15px;
                font-size: 14px;
            }

            .answer-letter {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-percentage {
                font-size: 36px;
            }

            .results-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Quiz will be rendered here -->
    <div id="quiz-container"></div>

    <!-- Global Script: Reusable quiz engine -->
    <script src="global_script.js"></script>
    
    <!-- Local Script: Question data for this specific quiz -->
    <script src="local_script.js"></script>
</body>
</html>
