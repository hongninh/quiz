<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Quiz + nút góp ý</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        .answer { display: block; width: 100%; margin: 8px 0; padding: 12px; text-align: left; cursor: pointer; }
        .answer.selected { background: #dbeafe; border-color: #2563eb; }
        #feedback-btn { position: fixed; right: 16px; bottom: 16px; padding: 10px 14px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
        #feedback-panel { position: fixed; right: 16px; bottom: 64px; width: 300px; padding: 12px; background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
        #feedback-panel textarea { width: 100%; height: 100px; box-sizing: border-box; }
        [hidden] { display: none; }
    </style>
</head>
<body>
    <!-- Quiz mẫu dùng quy ước data-quiz-* để bot đọc được ngữ cảnh -->
    <main data-quiz-game-id="demo-001">
        <h1>🎯 Quiz demo</h1>
        <section id="question-box">
            <p>Câu <span data-quiz-question-number></span>/<span data-quiz-total></span></p>
            <p data-quiz-question-text></p>
            <div id="answers"></div>
            <button data-quiz-next disabled>Tiếp theo →</button>
        </section>
        <section data-quiz-result hidden>
            <h2>Kết quả: <span id="score"></span></h2>
        </section>
    </main>

    <!-- Mô phỏng tool góp ý nội bộ: nút góc phải-dưới → form mô tả + ảnh → Gửi -->
    <button id="feedback-btn" onclick="document.getElementById('feedback-panel').hidden = false">💬 Góp ý</button>
    <div id="feedback-panel" role="dialog" aria-label="Form góp ý" hidden>
        <form id="feedback-form">
            <textarea name="content" placeholder="Mô tả vấn đề..." required></textarea>
            <p><input type="file" name="screenshot" accept="image/*"></p>
            <button type="submit">Gửi</button>
        </form>
        <p id="feedback-done" hidden>Cảm ơn bạn đã góp ý!</p>
    </div>

    <script>
        const questions = [
            { q: 'JavaScript là gì?', a: ['Ngôn ngữ lập trình', 'Một loại cà phê'], correct: 0 },
            { q: 'HTML là viết tắt của gì?', a: ['Hyper Text Markup Language', 'Home Tool Markup Language'], correct: 0 }
        ];
        const $ = (selector) => document.querySelector(selector);
        const nextBtn = $('[data-quiz-next]');
        let current = 0, score = 0, selected = null;

        function render() {
            const item = questions[current];
            $('[data-quiz-question-number]').textContent = current + 1;
            $('[data-quiz-total]').textContent = questions.length;
            $('[data-quiz-question-text]').textContent = item.q;
            const box = $('#answers');
            box.innerHTML = '';
            item.a.forEach((text, i) => {
                const btn = document.createElement('button');
                btn.className = 'answer';
                btn.setAttribute('data-quiz-answer', i);
                btn.textContent = text;
                btn.onclick = () => {
                    selected = i;
                    box.querySelectorAll('.answer').forEach((b, j) => b.classList.toggle('selected', j === i));
                    nextBtn.disabled = false;
                };
                box.appendChild(btn);
            });
            selected = null;
            nextBtn.disabled = true;
        }

        nextBtn.onclick = () => {
            if (selected === questions[current].correct) score++;
            current++;
            if (current < questions.length) return render();
            $('#question-box').hidden = true;
            $('[data-quiz-result]').hidden = false;
            $('#score').textContent = score + '/' + questions.length;
        };
        render();
    </script>

    <script>
        // Tool thật sẽ gửi lên server; bản mô phỏng chỉ giữ lại để kiểm tra
        window.submittedFeedbacks = [];
        document.getElementById('feedback-form').onsubmit = (event) => {
            event.preventDefault();
            const form = event.target;
            window.submittedFeedbacks.push({
                content: form.content.value,
                screenshot: form.screenshot.files[0] ? form.screenshot.files[0].name : null
            });
            form.hidden = true;
            document.getElementById('feedback-done').hidden = false;
        };
    </script>
</body>
</html>
